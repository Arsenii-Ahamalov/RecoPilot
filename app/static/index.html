<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>RecoPilot Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@2.0.6/css/pico.min.css">
  <style>
    body { max-width: 900px; margin: 24px auto; }
    section { border: 1px solid var(--muted-border-color,#eaeaea); padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    input { margin: 4px 6px; }
    pre { background: #f7f7f7; padding: 8px; white-space: pre-wrap; }
    button { cursor: pointer; }
    .muted { color: #777; }
    .stars { display:inline-block; margin-left:6px; }
    .stars span { cursor:pointer; font-size: 18px; color:#f5a623; user-select:none; }
    .stars span.off { color:#d0d0d0; }
    .fade { opacity: 0; transform: translateY(6px); transition: opacity .25s ease, transform .25s ease; }
    .fade.show { opacity: 1; transform: none; }
    .spinner { display:none; width:18px; height:18px; border:2px solid #ddd; border-top-color:#555; border-radius:50%; animation: spin .7s linear infinite; margin-left:6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>RecoPilot Demo</h1>

  <section>
    <h3>1) Start session</h3>
    <button id="btnStart" onclick="startSession()">Start</button>
    <div id="sessionInfo" class="muted"></div>
  </section>

  <section>
    <h3>2) Rate sample movies</h3>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">
      <label style="margin:0;">Count
        <input id="count" type="number" min="1" max="100" value="20" style="width:90px;">
      </label>
      <button id="btnLoad" onclick="loadSample(false,false)" disabled>Apply</button>
      <span id="spinnerSample" class="spinner" aria-hidden="true"></span>
    </div>
    <div id="sample"></div>
    <button id="btnSubmit" onclick="submitRatings()" disabled>Submit ratings</button>
    <div id="rateOut" class="muted"></div>
  </section>

  <section>
    <h3>2.1) Search & rate by title</h3>
    <input id="q" placeholder="Type a movie title..." />
    <button id="btnSearch" onclick="searchMovies()" disabled>Search</button>
    <span id="spinnerSearch" class="spinner" aria-hidden="true"></span>
    <div id="searchResults"></div>
  </section>

  <section>
    <h3>3) Get recommendations</h3>
    <label>Model
      <select id="model">
        <option value="BasicMF" selected>BasicMF</option>
        <option value="ItemCF">ItemCF</option>
        <option value="UserCF">UserCF</option>
        <option value="Genre">Genre</option>
        <option value="Demo">Demo</option>
        <option value="SVD">SVD</option>
      </select>
    </label>
    <input id="k" placeholder="k (default 10)" />
    <button id="btnRecs" onclick="getRecs()" disabled>Recommend</button>
    <div id="recsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;"></div>
    <pre id="recs" class="muted"></pre>
  </section>

  <section>
    <h3>Predict (debug)</h3>
    <input id="p_user" placeholder="userId" />
    <input id="p_item" placeholder="movieId" />
    <button onclick="predict()">Predict</button>
    <pre id="p_out"></pre>
  </section>

<script>
let sessionId = null;
let userId = null;
let ratingsDraft = {}; // movieId -> rating

async function startSession() {
  const res = await fetch('/session/start', { method: 'POST' });
  const data = await res.json();
  sessionId = data.sessionId;
  userId = data.userId;
  document.getElementById('sessionInfo').textContent = `Session: ${sessionId}, userId: ${userId}`;
  // enable buttons after session starts
  document.getElementById('btnLoad').disabled = false;
  document.getElementById('btnSubmit').disabled = false;
  document.getElementById('btnRecs').disabled = false;
  document.getElementById('btnSearch').disabled = false;
}

async function loadSample(_increment=false, append=false) {
  const count = Number(document.getElementById('count').value) || 20;
  const btn = document.getElementById('btnLoad');
  const sp = document.getElementById('spinnerSample');
  btn.disabled = true; sp.style.display = 'inline-block';
  const res = await fetch(`/movies/sample?size=${count}&mode=random`);
  const items = await res.json();
  const container = document.getElementById('sample');
  if (!append) {
    container.innerHTML = '';
    ratingsDraft = {};
  }
  items.forEach(m => {
    const div = document.createElement('div');
    const hasYearInTitle = m.year && typeof m.title === 'string' && m.title.includes(`(${m.year})`);
    const year = m.year && !hasYearInTitle ? ` (${m.year})` : '';
    const stars = [1,2,3,4,5].map(v=>`<span data-v="${v}" class="off">★</span>`).join('');
    div.className = 'fade';
    div.innerHTML = `
      <span>${m.title || '(title N/A)'}${year}</span>
      <span class="stars" data-mid="${m.movieId}">${stars}</span>
    `;
    container.appendChild(div);
    requestAnimationFrame(()=>div.classList.add('show'));
  });
  // attach star handlers
  container.querySelectorAll('.stars').forEach(st => {
    st.addEventListener('click', e => {
      const target = e.target.closest('span[data-v]');
      if (!target) return;
      const v = Number(target.getAttribute('data-v'));
      const mid = Number(st.getAttribute('data-mid'));
      ratingsDraft[mid] = v;
      [...st.querySelectorAll('span[data-v]')].forEach(s => {
        const sv = Number(s.getAttribute('data-v'));
        s.classList.toggle('off', sv > v);
      });
    });
  });
  btn.disabled = false; sp.style.display = 'none';
}

async function searchMovies(){
  const term = (document.getElementById('q').value || '').trim();
  if (!term) return;
  const btn = document.getElementById('btnSearch');
  const sp = document.getElementById('spinnerSearch');
  btn.disabled = true; sp.style.display = 'inline-block';
  const res = await fetch(`/movies/search?q=${encodeURIComponent(term)}&limit=20`);
  const items = await res.json();
  renderRateList(items, document.getElementById('searchResults'));
  btn.disabled = false; sp.style.display = 'none';
}

function renderRateList(items, container){
  container.innerHTML = '';
  items.forEach(m => {
    const div = document.createElement('div');
    const hasYearInTitle = m.year && typeof m.title === 'string' && m.title.includes(`(${m.year})`);
    const year = m.year && !hasYearInTitle ? ` (${m.year})` : '';
    const stars = [1,2,3,4,5].map(v=>`<span data-v="${v}" class="off">★</span>`).join('');
    const poster = m.posterUrl || 'https://via.placeholder.com/92x138?text=No+Image';
    div.style.display = 'flex'; div.style.alignItems = 'center'; div.style.gap = '8px';
    div.className = 'fade';
    div.innerHTML = `
      <img src="${poster}" alt="poster" style="width:46px;height:auto;border-radius:4px;"/>
      <span>${m.title || '(title N/A)'}${year}</span>
      <span class="stars" data-mid="${m.movieId}">${stars}</span>
    `;
    container.appendChild(div);
    requestAnimationFrame(()=>div.classList.add('show'));
  });
  // attach star handlers
  container.querySelectorAll('.stars').forEach(st => {
    st.addEventListener('click', e => {
      const target = e.target.closest('span[data-v]');
      if (!target) return;
      const v = Number(target.getAttribute('data-v'));
      const mid = Number(st.getAttribute('data-mid'));
      ratingsDraft[mid] = v;
      [...st.querySelectorAll('span[data-v]')].forEach(s => {
        const sv = Number(s.getAttribute('data-v'));
        s.classList.toggle('off', sv > v);
      });
    });
  });
}

async function submitRatings() {
  if (!sessionId) { alert('Start session first'); return; }
  const payload = Object.entries(ratingsDraft).map(([mid, rt]) => ({ movieId: Number(mid), rating: Number(rt) }));
  const res = await fetch('/rate', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ sessionId, ratings: payload })
  });
  const out = await res.json();
  if (res.ok) {
    document.getElementById('rateOut').textContent = `Saved ${out.numRatings} ratings.`;
  } else {
    document.getElementById('rateOut').textContent = out.message || 'Error saving ratings';
  }
}

async function getRecs() {
  if (!sessionId) { alert('Start session first'); return; }
  const k = document.getElementById('k').value || 10;
  const model = document.getElementById('model').value;
  const res = await fetch(`/recommend?sessionId=${sessionId}&k=${k}&model=${encodeURIComponent(model)}`);
  if (res.ok) {
    const data = await res.json();
    renderRecs(data);
  } else {
    const err = await res.json();
    document.getElementById('recs').textContent = err.message || 'Please rate some movies first.';
  }
}

function renderRecs(data){
  const grid = document.getElementById('recsGrid');
  grid.innerHTML = '';
  const items = (data && data.items) || [];
  items.forEach(it => {
    const card = document.createElement('article');
    card.style.border = '1px solid #eee';
    card.style.borderRadius = '8px';
    card.style.overflow = 'hidden';
    card.style.background = '#fff';
    card.className = 'fade';
    const img = document.createElement('img');
    img.src = it.posterUrl || 'https://via.placeholder.com/342x513?text=No+Image';
    img.alt = it.title || 'poster';
    img.style.width = '100%';
    const caption = document.createElement('div');
    caption.style.padding = '8px';
    caption.innerHTML = `<strong>${it.title || ''}</strong><br><span class="muted">${it.year || ''}</span>`;
    card.appendChild(img);
    card.appendChild(caption);
    grid.appendChild(card);
    requestAnimationFrame(()=>card.classList.add('show'));
  });
  document.getElementById('recs').textContent = data && data.model ? `Model: ${data.model}` : '';
}

async function predict() {
  const u = Number(document.getElementById('p_user').value);
  const i = Number(document.getElementById('p_item').value);
  try {
    const res = await fetch('/predict', {
      method:'POST', headers:{'Content-Type':'application/json'},
      cache: 'no-store',
      body: JSON.stringify({ userId: u, movieId: i })
    });
    const data = await res.json();
    document.getElementById('p_out').textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    document.getElementById('p_out').textContent = 'Request failed';
  }
}
</script>
</body>
</html>
